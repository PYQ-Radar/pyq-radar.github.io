name: Fetch official UPSC question papers

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  fetch-upsc-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-upsc.txt

      - name: Discover official UPSC PDFs and extract text
        run: python scripts/upsc_pyq_fetcher.py

      - name: Parse and bulk-import UPSC Prelims GS-I questions
        env:
          PYQ_IMPORT_URL: https://fzepobjbcehirerwtnsz.supabase.co/functions/v1/import-pyq
          PYQ_IMPORT_TOKEN: ${{ secrets.PYQ_IMPORT_TOKEN }}
          UPSC_EXAM_ID: ${{ secrets.UPSC_EXAM_ID }}
        run: python scripts/parse_and_import_upsc.py

      - name: Upload fetched papers and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upsc-pyq-source-data
          path: upsc-data/
          if-no-files-found: warn
          retention-days: 14
